<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aniversários Tucuvori</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* MODO ESCURO (Fundo Preto com Variações de Verde) */
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #0d2818;
      --surface-card: #163824;
      --text-primary: #e8f5e9;
      --text-secondary: #b7e4c7;
      --accent: #52b788;
      --accent-soft: rgba(82, 183, 136, 0.15);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #1b4332;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }

    /* MODO CLARO (Fundo Claro com Variações de Verde) */
    [data-theme="light"] {
      --bg: #f0f4f1;
      --surface: #e8f5e9;
      --surface-card: #ffffff;
      --text-primary: #111111;
      --text-secondary: #334433;
      --accent: #1b4332;
      --accent-soft: rgba(27, 67, 50, 0.12);
      --danger: #b71c1c;
      --danger-hover: #8e0000;
      --border: #b7e4c7;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      padding: 30px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 520px;
      flex: 1;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .header-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--accent);
    }

    .btn-theme {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .btn-theme:hover { border-color: var(--accent); }

    .header-icon {
      width: 54px;
      height: 54px;
      margin: 8px auto 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--accent);
      color: var(--accent);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header-icon svg { width: 28px; height: 28px; fill: currentColor; }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.8px;
      line-height: 1.25;
      text-transform: uppercase;
    }

    header h1 span {
      color: var(--accent);
      display: block;
      font-size: 1.1rem;
      margin-top: 2px;
      font-weight: 600;
    }

    .header-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 14px 0 10px 0;
    }

    .header-divider .line { height: 1px; width: 50px; background: var(--accent); opacity: 0.6; }
    .header-divider .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }

    header p {
      color: var(--text-secondary);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-weight: 600;
    }

    .highlights-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .highlight-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .highlight-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent);
    }

    .highlight-card .label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .highlight-card .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .highlight-card .subtext {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
    }

    .export-bar { display: flex; gap: 10px; margin-bottom: 20px; }

    .btn-export {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 9px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .btn-export:hover { border-color: var(--accent); color: var(--accent); }

    .btn-toggle-form {
      display: none;
      width: 100%;
      background: var(--surface);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      margin-bottom: 24px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .btn-toggle-form:hover { background: var(--accent-soft); }

    .form-card {
      background: var(--surface);
      padding: 22px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 30px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .form-card h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .form-row { margin-bottom: 12px; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background-color: var(--surface-card);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text-primary);
      transition: all 0.2s ease;
      outline: none;
    }

    input::placeholder { color: var(--text-secondary); }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

    .photo-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--surface-card);
      margin-bottom: 12px;
    }

    .photo-preview {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center;
      font-size: 20px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }

    .btn-group { display: flex; gap: 10px; }

    button.btn-submit {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    [data-theme="dark"] button.btn-submit { color: #000000; }
    button.btn-submit:hover { opacity: 0.9; }

    button.btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 12px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: none;
    }

    button.btn-cancel:hover { background: var(--surface-card); color: var(--text-primary); }

    .month-section { margin-bottom: 24px; }

    .month-header {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--accent);
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .member-item {
      background: var(--surface);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--surface-card);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid var(--border);
      overflow: hidden;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .member-info { flex: 1; overflow: hidden; }

    .member-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-group { font-size: 0.75rem; color: var(--text-secondary); }

    .member-date {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      min-width: 55px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .actions { display: flex; gap: 6px; margin-left: 4px; }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.75rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .btn-edit:hover { color: var(--accent); border-color: var(--accent); }
    .btn-delete:hover { color: #ffffff; background-color: var(--danger); border-color: var(--danger); }

    .empty-state { font-size: 0.85rem; color: var(--text-secondary); font-style: italic; }
    .loading, .empty { text-align: center; color: var(--text-secondary); font-size: 0.9rem; padding: 30px 0; }

    footer {
      margin-top: 40px;
      padding: 15px 0;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      width: 100%;
      max-width: 520px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .btn-toggle-form { display: block; }
      .form-card { display: none; }
      .form-card.show-mobile { display: block; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top-bar">
        <span class="header-badge">Tucuvori</span>
        <button class="btn-theme" id="theme-toggle" onclick="toggleTheme()">
          <span id="theme-icon">☀️</span> <span id="theme-text">Modo Claro</span>
        </button>
      </div>

      <div class="header-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
        </svg>
      </div>

      <h1>
        Templo de Umbanda
        <span>Caboclo Ubirajara e Vovó Rita</span>
      </h1>

      <div class="header-divider">
        <div class="line"></div>
        <div class="dot"></div>
        <div class="line"></div>
      </div>

      <p>Registro Geral de Aniversários</p>
    </header>

    <div class="highlights-grid">
      <div class="highlight-card">
        <span class="label">Aniversariante de Hoje</span>
        <div id="today-content" class="value">Carregando...</div>
      </div>
      <div class="highlight-card">
        <span class="label">Próximo Aniversário</span>
        <div id="next-content" class="value">Carregando...</div>
      </div>
    </div>

    <button class="btn-toggle-form" id="btn-toggle-form" onclick="toggleFormMobile()">
      + Cadastrar Aniversariante
    </button>

    <div class="form-card" id="form-card">
      <h2 id="form-title">Novo Aniversário</h2>
      <form id="add-form">
        <input type="hidden" id="edit-id" value="">
        
        <div class="photo-box">
          <div class="photo-preview" id="photoPreview">📷</div>
          <input type="file" id="photo" accept="image/*" onchange="previewPhoto(event)" style="font-size:0.75rem;">
        </div>

        <div class="form-row">
          <input type="text" id="name" placeholder="Nome completo" required>
        </div>
        <div class="form-row">
          <input type="text" id="date" placeholder="Dia / Mês (DD/MM)" maxlength="5" required>
        </div>
        <div class="form-row">
          <input type="text" id="group" placeholder="Observação / Grupo (Opcional)">
        </div>
        <div class="btn-group">
          <button type="submit" id="btn-submit" class="btn-submit">Cadastrar Membro</button>
          <button type="button" id="btn-cancel" class="btn-cancel" onclick="resetForm()">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="export-bar">
      <button class="btn-export" onclick="exportToPDF()">Exportar PDF</button>
      <button class="btn-export" onclick="exportToExcel()">Exportar Excel</button>
    </div>

    <div id="members-list">
      <div class="loading">Carregando dados...</div>
    </div>
  </div>

  <footer>Nyllo Tech</footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCLfCY7VCgtW92f3Dlqst5yp6BTNqw5UuQ",
      authDomain: "calendario-tucuvori.firebaseapp.com",
      databaseURL: "https://calendario-tucuvori-default-rtdb.firebaseio.com",
      projectId: "calendario-tucuvori",
      storageBucket: "calendario-tucuvori.firebasestorage.app",
      messagingSenderId: "364406314929",
      appId: "1:364406314929:web:ec7e7709bec677690b4f90"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const membersRef = database.ref('aniversariantes');

    let globalMembersList = [];
    let currentPhoto = "";

    const monthsNames = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    }

    function updateThemeButton(theme) {
      const icon = document.getElementById('theme-icon');
      const text = document.getElementById('theme-text');
      if (theme === 'dark') {
        icon.innerText = '☀️';
        text.innerText = 'Modo Claro';
      } else {
        icon.innerText = '🌙';
        text.innerText = 'Modo Escuro';
      }
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeButton(savedTheme);

    function toggleFormMobile() {
      const formCard = document.getElementById('form-card');
      const btnToggle = document.getElementById('btn-toggle-form');
      if (formCard.classList.contains('show-mobile')) {
        formCard.classList.remove('show-mobile');
        btnToggle.innerText = '+ Cadastrar Aniversariante';
      } else {
        formCard.classList.add('show-mobile');
        btnToggle.innerText = '− Ocultar Formulário';
      }
    }

    function previewPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 1.5 * 1024 * 1024) {
        alert("Escolha uma foto de até 1,5 MB.");
        e.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        currentPhoto = reader.result;
        document.getElementById("photoPreview").innerHTML = `<img src="${currentPhoto}" alt="">`;
      };
      reader.readAsDataURL(file);
    }

    const dateInput = document.getElementById('date');
    dateInput.addEventListener('input', (e) => {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length >= 3) {
        value = value.substring(0, 2) + '/' + value.substring(2, 4);
      }
      e.target.value = value;
    });

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const dateVal = document.getElementById('date').value.trim();
      const group = document.getElementById('group').value.trim();
      const editId = document.getElementById('edit-id').value;

      const parts = dateVal.split('/');
      if (parts.length !== 2) {
        alert('Por favor, informe a data no formato DD/MM.');
        return;
      }

      const day = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);

      if (name && day >= 1 && day <= 31 && month >= 1 && month <= 12) {
        const payload = {
          name,
          birth: `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`,
          group,
          photo: currentPhoto
        };

        if (editId) {
          membersRef.child(editId).update(payload);
        } else {
          membersRef.push(payload);
        }

        resetForm();
      } else {
        alert('Data inválida! Verifique o dia (1-31) e o mês (1-12).');
      }
    });

    function editMember(id) {
      const m = globalMembersList.find(x => x.id === id);
      if (!m) return;

      const formCard = document.getElementById('form-card');
      formCard.classList.add('show-mobile');
      document.getElementById('btn-toggle-form').innerText = '− Ocultar Formulário';

      document.getElementById('edit-id').value = id;
      document.getElementById('name').value = m.name;
      document.getElementById('date').value = `${String(m.day).padStart(2, '0')}/${String(m.month).padStart(2, '0')}`;
      document.getElementById('group').value = m.group || "";
      
      currentPhoto = m.photo || "";
      document.getElementById("photoPreview").innerHTML = currentPhoto ? `<img src="${currentPhoto}">` : "📷";

      document.getElementById('form-title').innerText = 'Editar Aniversário';
      document.getElementById('btn-submit').innerText = 'Salvar Alterações';
      document.getElementById('btn-cancel').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('add-form').reset();
      currentPhoto = "";
      document.getElementById("photoPreview").innerHTML = "📷";

      document.getElementById('form-title').innerText = 'Novo Aniversário';
      document.getElementById('btn-submit').innerText = 'Cadastrar Membro';
      document.getElementById('btn-cancel').style.display = 'none';

      const formCard = document.getElementById('form-card');
      formCard.classList.remove('show-mobile');
      document.getElementById('btn-toggle-form').innerText = '+ Cadastrar Aniversariante';
    }

    function deleteMember(id) {
      if (confirm('Deseja remover este registro?')) {
        membersRef.child(id).remove();
        if (document.getElementById('edit-id').value === id) {
          resetForm();
        }
      }
    }

    function getNextOccurrence(day, month) {
      const now = new Date(); now.setHours(0,0,0,0);
      let year = now.getFullYear();
      let next = new Date(year, month - 1, day);
      if (next < now) next = new Date(year + 1, month - 1, day);
      return next;
    }

    function updateHighlights(members) {
      const now = new Date();
      const currentDay = now.getDate();
      const currentMonth = now.getMonth() + 1;

      const todaysMembers = members.filter(m => m.day === currentDay && m.month === currentMonth);
      const todayContainer = document.getElementById('today-content');

      if (todaysMembers.length > 0) {
        todayContainer.innerHTML = todaysMembers.map(m => `<div>${m.name} 🎉</div>`).join('');
      } else {
        todayContainer.innerHTML = '<span class="empty-state">Nenhum hoje</span>';
      }

      const nextContainer = document.getElementById('next-content');
      const sortedByNext = [...members].sort((a, b) => 
        getNextOccurrence(a.day, a.month) - getNextOccurrence(b.day, b.month)
      );

      if (sortedByNext.length > 0) {
        const next = sortedByNext[0];
        const dayStr = String(next.day).padStart(2, '0');
        const monthStr = String(next.month).padStart(2, '0');
        nextContainer.innerHTML = `
          <div>${next.name}</div>
          <div class="subtext">${dayStr}/${monthStr}</div>
        `;
      } else {
        nextContainer.innerHTML = '<span class="empty-state">Sem dados</span>';
      }
    }

    function exportToExcel() {
      if (!globalMembersList.length) return alert('Sem dados para exportar.');
      const rows = [];
      monthsNames.forEach((monthName, index) => {
        const monthMembers = globalMembersList.filter(m => m.month === index + 1).sort((a, b) => a.day - b.day);
        monthMembers.forEach(m => {
          rows.push({
            "Mês": monthName,
            "Nome do Membro": m.name,
            "Data": `${String(m.day).padStart(2, '0')}/${String(m.month).padStart(2, '0')}`,
            "Observação": m.group || ""
          });
        });
      });
      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Aniversariantes");
      XLSX.writeFile(workbook, "Aniversariantes_TUCUVORI.xlsx");
    }

    function exportToPDF() {
      if (!globalMembersList.length) return alert('Sem dados para exportar.');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(15);
      doc.setTextColor(27, 67, 50);
      doc.text("Templo de Umbanda Caboclo Ubirajara e Vovo Rita", 14, 18);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(80, 80, 80);
      doc.text("Relatorio Oficial de Aniversarios", 14, 25);

      const tableBody = [];
      monthsNames.forEach((monthName, index) => {
        const monthMembers = globalMembersList.filter(m => m.month === index + 1).sort((a, b) => a.day - b.day);
        if (monthMembers.length > 0) {
          tableBody.push([{ content: monthName.toUpperCase(), colSpan: 2, styles: { fillColor: [232, 245, 233], textColor: [27, 67, 50], fontStyle: 'bold' } }]);
          monthMembers.forEach(m => {
            tableBody.push([m.name, `${String(m.day).padStart(2, '0')}/${String(m.month).padStart(2, '0')}`]);
          });
        }
      });

      doc.autoTable({
        startY: 32,
        head: [['Nome do Membro', 'Data']],
        body: tableBody,
        theme: 'grid',
        headStyles: { fillColor: [27, 67, 50], textColor: [255, 255, 255] }
      });
      doc.save("Aniversariantes_TUCUVORI.pdf");
    }

    membersRef.on('value', (snapshot) => {
      const container = document.getElementById('members-list');
      container.innerHTML = '';
      const data = snapshot.val();
      
      if (!data) {
        globalMembersList = [];
        container.innerHTML = '<div class="empty">Nenhum aniversário cadastrado.</div>';
        document.getElementById('today-content').innerHTML = '<span class="empty-state">Nenhum hoje</span>';
        document.getElementById('next-content').innerHTML = '<span class="empty-state">Sem dados</span>';
        return;
      }

      const members = [];
      Object.keys(data).forEach(key => {
        let day = 1, month = 1;
        if (data[key].birth) {
          const parts = data[key].birth.split('-');
          if (parts.length === 2) { month = parseInt(parts[0], 10); day = parseInt(parts[1], 10); }
        } else {
          day = parseInt(data[key].day, 10);
          month = parseInt(data[key].month, 10);
        }

        members.push({
          id: key,
          name: data[key].name,
          day,
          month,
          group: data[key].group || '',
          photo: data[key].photo || ''
        });
      });

      globalMembersList = members;
      updateHighlights(members);

      monthsNames.forEach((monthName, index) => {
        const monthNumber = index + 1;
        const monthMembers = members.filter(m => m.month === monthNumber).sort((a, b) => a.day - b.day);

        if (monthMembers.length > 0) {
          const section = document.createElement('div');
          section.className = 'month-section';

          const title = document.createElement('div');
          title.className = 'month-header';
          title.innerText = monthName;
          section.appendChild(title);

          monthMembers.forEach(m => {
            const dayStr = String(m.day).padStart(2, '0');
            const monthStr = String(m.month).padStart(2, '0');
            const initials = m.name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();

            const item = document.createElement('div');
            item.className = 'member-item';
            item.innerHTML = `
              <div class="avatar">${m.photo ? `<img src="${m.photo}">` : initials}</div>
              <div class="member-info">
                <div class="member-name" title="${m.name}">${m.name}</div>
                ${m.group ? `<div class="member-group">${m.group}</div>` : ''}
              </div>
              <span class="member-date">${dayStr}/${monthStr}</span>
              <div class="actions">
                <button class="btn-action btn-edit" onclick="editMember('${m.id}')">Editar</button>
                <button class="btn-action btn-delete" onclick="deleteMember('${m.id}')">Excluir</button>
              </div>
            `;
            section.appendChild(item);
          });

          container.appendChild(section);
        }
      });
    });
  </script>
</body>
</html>
